spring:
  threads:
    virtual:
      enabled: true

  application:
    name: mangala-wallet-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mangala_dev}?currentSchema=${DB_SCHEMA:wallet}
    username: ${DB_USERNAME:wallet_service}
    password: ${DB_PASSWORD:wallet123}

  flyway:
    enabled: true
    schemas: wallet
    default-schema: wallet
    locations: classpath:/migration
    baseline-on-migrate: true

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
    mongodb:
      uri: mongodb://${MONGO_USER:admin}:${MONGO_PASSWORD:password123}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DB:wallet_db}?authSource=admin

  # Kafka Configuration
  kafka:
    enabled: ${KAFKA_ENABLED:true}
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 3
      batch-size: 16384
      linger-ms: 10
      buffer-memory: 33554432
    consumer:
      group-id: wallet-balance-aggregator
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual_immediate
      concurrency: 3

  # Cache Configuration
  cache:
    type: redis
    redis:
      time-to-live: 60000
      cache-null-values: false

application:
  wallet:
    # RPC Provider Configuration
    # For production, use Infura/Alchemy with API keys via environment variables
    # Free tier limits: Infura 100k req/day, Alchemy 300M CU/month
    rpc:
      # Global API key for Infura (if using Infura for all chains)
      infura-api-key: ${INFURA_API_KEY:}
      # Per-chain rate limiting
      max-concurrent-requests: ${RPC_MAX_CONCURRENT:10}
      request-timeout-ms: ${RPC_TIMEOUT_MS:30000}
      retry-attempts: ${RPC_RETRY_ATTEMPTS:3}
      retry-delay-ms: ${RPC_RETRY_DELAY_MS:1000}
    chains:
      ethereum:
        chain-id: 1
        rpc-url: ${ETH_RPC_URL:https://mainnet.infura.io/v3/${INFURA_API_KEY:demo}}
        block-confirmations: 12
        native-symbol: ETH
        native-decimals: 18
      bsc:
        chain-id: 56
        rpc-url: ${BSC_RPC_URL:https://bsc-dataseed1.binance.org/}
        block-confirmations: 15
        native-symbol: BNB
        native-decimals: 18
      polygon:
        chain-id: 137
        rpc-url: ${POLYGON_RPC_URL:https://polygon-mainnet.infura.io/v3/${INFURA_API_KEY:demo}}
        block-confirmations: 128
        native-symbol: MATIC
        native-decimals: 18
      arbitrum:
        chain-id: 42161
        rpc-url: ${ARBITRUM_RPC_URL:https://arbitrum-mainnet.infura.io/v3/${INFURA_API_KEY:demo}}
        block-confirmations: 64
        native-symbol: ETH
        native-decimals: 18
      sepolia:
        chain-id: 11155111
        rpc-url: ${SEPOLIA_RPC_URL:https://sepolia.infura.io/v3/${INFURA_API_KEY:demo}}
        block-confirmations: 3
        native-symbol: ETH
        native-decimals: 18

# Balance Sync Configuration
balance:
  sync:
    enabled: ${BALANCE_SYNC_ENABLED:true}
    interval-ms: ${BALANCE_SYNC_INTERVAL_MS:300000}  # 5 minutes
    batch-size: ${BALANCE_SYNC_BATCH_SIZE:100}
    lock-ttl-minutes: ${BALANCE_SYNC_LOCK_TTL:10}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  show-actuator: false
  default-produces-media-type: application/json
  default-consumes-media-type: application/json

logging:
  level:
    root: INFO
    org.flywaydb: DEBUG
    org.mangala.wallet: DEBUG

server:
  port: 8081

# Resilience4j Circuit Breaker Configuration
resilience4j:
  circuitbreaker:
    instances:
      rpcCircuitBreaker:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - java.io.IOException
          - java.net.SocketTimeoutException
          - java.util.concurrent.TimeoutException
  retry:
    instances:
      rpcRetry:
        max-attempts: 3
        wait-duration: 1s
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.io.IOException
          - java.net.SocketTimeoutException

# Portfolio Configuration
portfolio:
  cache:
    ttl-seconds: ${PORTFOLIO_CACHE_TTL:60}
  price:
    mock-enabled: ${PRICE_MOCK_ENABLED:true}
    history-enabled: ${PRICE_HISTORY_ENABLED:true}
    recording-interval-ms: ${PRICE_RECORDING_INTERVAL_MS:300000}
    cleanup-cron: ${PRICE_CLEANUP_CRON:0 0 * * * *}
