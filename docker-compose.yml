version: '3.8'

services:
  wallet-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mangala-wallet-service
    ports:
      - "8081:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=mangala_dev
      - DB_USERNAME=wallet_service
      - DB_PASSWORD=wallet123
      - DB_SCHEMA=wallet
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_DB=wallet_db
      - MONGO_USER=admin
      - MONGO_PASSWORD=password123
      - ETH_RPC_URL=${ETH_RPC_URL}
      - BSC_RPC_URL=${BSC_RPC_URL}
      - POLYGON_RPC_URL=${POLYGON_RPC_URL}
      - ARBITRUM_RPC_URL=${ARBITRUM_RPC_URL}
    networks:
      - mangala-network

networks:
  mangala-network:
    external: true
    name: mangala-network
